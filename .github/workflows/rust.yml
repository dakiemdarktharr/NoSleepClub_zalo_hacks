name: Rust foundation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: ./scripts/Build-Rust.ps1 -Action Test
      - run: ./scripts/Build-Rust.ps1 -Action Clippy

# CI uses generated synthetic fixtures; no voice model, private dataset,
# microphone, credentials or paid API is required. Real-model probes are opt-in.
