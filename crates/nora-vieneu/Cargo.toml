[package]
name = "nora-vieneu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
description = "Bounded Rust CPU host for VieNeu v3 Turbo ONNX artifacts"

[[example]]
name = "vieneu-render"
path = "examples/render.rs"
required-features = ["onnx", "g2p"]

[features]
default = []
onnx = ["dep:ort"]
g2p = ["dep:sea-g2p-rs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ndarray.workspace = true
ort = { workspace = true, optional = true }
rand = { version = "0.9", default-features = false, features = ["small_rng"] }
regex = "1"
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
zip = { version = "=9.0.0", default-features = false, features = ["deflate"] }
sea-g2p-rs = { git = "https://github.com/pnnbao97/sea-g2p", rev = "e825173f235d08ea19315b2b279fb11153b44cea", default-features = false, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
