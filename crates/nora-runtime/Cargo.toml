[package]
name = "nora-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "NORA supervised desktop goal and isolated local voice runtime"

[features]
default = []
native-voice = ["nora-audio/onnx", "nora-audio/whisper", "nora-audio/capture", "nora-vieneu/onnx", "nora-vieneu/g2p", "dep:ort", "dep:cpal"]

[dependencies]
nora-core = { path = "../nora-core" }
nora-store = { path = "../nora-store" }
nora-broker = { path = "../nora-broker" }
nora-llm = { path = "../nora-llm" }
nora-platform = { path = "../nora-platform" }
nora-desktop = { path = "../nora-desktop" }
nora-audio = { path = "../nora-audio" }
nora-vieneu = { path = "../nora-vieneu" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
cap-std.workspace = true
ort = { workspace = true, optional = true }
cpal = { version = "=0.16.0", optional = true }
getrandom = "=0.4.3"

[lints]
workspace = true
