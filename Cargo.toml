[workspace]
members = [
    "crates/nora-core",
    "crates/nora-audio",
    "crates/nora-vieneu",
    "crates/nora-store",
    "crates/nora-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/dakiemdarktharr/NoSleepClub_zalo_hacks"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
cap-std = "4.0.3"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "ndarray", "api-31"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1
